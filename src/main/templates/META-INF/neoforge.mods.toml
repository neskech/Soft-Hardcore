modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Neskech, AlternateFire"
description='''
A soft-hardcore, highly configurable mod that gives each player a limited number of lives.
Once players die, they are banned for a configurable amount of time. Other players can drop hearts to give players back lives.
'''

[[mixins]]
config="softhardcore.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
